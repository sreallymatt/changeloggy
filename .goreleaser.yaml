version: 2

project_name: changeloggy

builds:
  - env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -mod=vendor
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X main.version={{ .Tag }}
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: freebsd
        goarch: arm64

universal_binaries:
  - replace: false

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true

release:
  mode: replace
