version: "2"

run:
  timeout: "10m"
  modules-download-mode: "vendor"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - copyloopvar
    - decorder
    - durationcheck
    - dupword
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - goconst
    - gocritic
    - govet
    - gosec
    - ineffassign
    - intrange
    - makezero
    - mirror
    - misspell
    - modernize
    - nakedret
    - nilerr
    - nilnesserr
    - noctx
    - nolintlint
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - recvcheck
    - staticcheck
    - tagalign
    - testableexamples
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace

  exclusions:
    rules:
      - text: 'shadow: declaration of "err"'
        source: "if .*err :="
        linters:
          - govet

  settings:
    errcheck:
      check-type-assertions: true
      exclude-functions:
        - "fmt.Fprintf"
        - "fmt.Fprintln"
        - "(*os.File).Close"
        - "os.Remove"
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      enabled-tags:
        - "diagnostic"
        - "style"
        - "performance"
      settings:
        rangeValCopy:
          sizeThreshold: 512
        hugeParam:
          sizeThreshold: 512
    govet:
      enable-all: true
    staticcheck:
      checks:
        - "all"
        - "-ST1000"
    nakedret:
      max-func-lines: 30
    misspell:
      locale: "UK"
    tagalign:
      sort: true

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
