name: changelog-privileged

on:
  workflow_run:
    workflows:
      - "changelog"
    types:
      - "completed"

permissions: {}

jobs:
  comment:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Download check failure artifacts
        id: download
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          pattern: changelog-check-failed-*
          path: artifacts/
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          merge-multiple: true
        continue-on-error: true

      - name: Comment on missing changelog entry
        if: steps.download.outcome == 'success'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs')
            const prNumber = parseInt(fs.readFileSync('artifacts/pr-number', 'utf8').trim())
            const types = fs.readFileSync('artifacts/types-table', 'utf8').trim()
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: [
                "This PR is missing a changelog entry. Please add one by commenting:",
                "",
                "````",
                "/changelog",
                "[<type>] <body>",
                "````",
                "",
                "Or to replace existing entries:",
                "",
                "````",
                "/changelog replace",
                "[<type>] <body>",
                "````",
                "",
                "Available types:",
                "",
                "```",
                types,
                "```",
              ].join("\n"),
            })
